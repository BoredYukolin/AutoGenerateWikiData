name: Generate tags
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Minecraft Version'
        required: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Create tag data
        env:
          MAKE_VERSION: ${{ github.event.inputs.version }}
        run: |
          chmod +x gradlew
          ./gradlew run

      - name: Run tag generator
        run: |
          cd ./run/runtime
          java -DbundlerMainClass=net.minecraft.data.Main -jar ../remapped/${{ github.event.inputs.version }}-server.jar --output=../data-gen --reports --server

      - name: Upload tag data
        uses: actions/upload-artifact@v4
        with:
          name: tags-${{ github.event.inputs.version }}
          path: run/output